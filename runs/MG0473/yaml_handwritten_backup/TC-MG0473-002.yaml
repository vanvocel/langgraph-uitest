case_id: TC-MG0473-002
title: 人工待清洗-清洗次数为勾选多选且触发器展示已选数量
requirement_id: MG0473
base_url: https://lead.z-niu.com
tags:
- MG0473
- live
- excel
meta:
  live_notes: 现网下拉无清空/确定，勾选后点击外部收起；数量展示为 + N
preconditions:
- auth: logged_in
  account_ref: default_tester
defaults:
  on_action:
    observe:
      window_ms: 8000
      forbid_toast_levels:
      - error
steps:
- action: open
  url: https://lead.z-niu.com/pool/clean
  description: 打开清洗池
- action: wait_visible
  element: 人工待清洗
- action: click
  element: 人工待清洗
  description: 进入人工待清洗
- action: click_if_visible
  element: 展开筛选
- action: click_if_visible
  element: 全部
- action: click_if_visible
  element: 重置
- action: wait_visible
  element: 查询
- action: multi_select
  element: 清洗次数
  value: 未清洗,首次清洗
- action: assert_text_contains
  element: 清洗次数
  expect: + 1
  description: 现网无确定/清空按钮，触发器展示「未清洗 + 1」

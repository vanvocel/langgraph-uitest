case_id: TC_TOAST_WRONG_PASSWORD
title: 错误密码应出现失败 toast
requirement_id: TOAST-LIVE
base_url: https://login.z-niu.com/
tags:
  - toast
  - expect-error
steps:
  - action: open
    url: https://login.z-niu.com/
    description: 打开登录页
    observe:
      forbid_toast_levels: []
  - action: fill
    element: 用户名输入框
    value: "16676583008"
    description: 输入手机号
  - action: wait_visible
    element: 组织下拉
    timeout_ms: 10000
    description: 等待组织下拉出现
  - action: select
    element: 组织下拉
    value: 墨斗科技 / 总部
    description: 选择组织 墨斗科技 / 总部
  - action: fill
    element: 密码输入框
    value: wrong-password
    description: 输入错误密码
  - action: click
    element: 登录按钮
    description: 点击登录，期望出现密码错误 toast
    observe:
      window_ms: 8000
      forbid_toast_levels: []
      toasts:
        - expect: error
          contains: 手机号或密码错误

case_id: TC-QXGZ-010
title: 跨一级重名二级渠道按一级/二级名称区分展示与配置
requirement_id: MG0557
base_url: https://lead.z-niu.com
preconditions:
- auth: logged_in
  account_ref: default_tester
- description: 主数据存在两个不同一级下同名二级渠道（一级A/二级X、一级B/二级X），且均符合候选过滤条件
defaults:
  on_action:
    observe:
      window_ms: 8000
      toasts: []
      forbid_toast_levels:
      - error
steps:
- action: open
  url: https://lead.z-niu.com/rule/clean/
  description: 打开清洗规则页
- action: wait_visible
  element: 清洗评分规则
- action: click
  element: 清洗评分规则
- action: click
  element: 修改
- action: click
  element: 添加渠道
- action: fill
  element: 渠道搜索框
  value: X
- action: assert_text_contains
  element: 渠道选择器
  expect: 一级A / 二级X
- action: assert_text_contains
  element: 渠道选择器
  expect: 一级B / 二级X
- action: click
  element: 一级A / 二级X
- action: fill
  element: 渠道得分
  value: '10'
- action: click
  element: 保存
- action: click
  element: 添加渠道
- action: fill
  element: 渠道搜索框
  value: X
- action: click
  element: 一级B / 二级X
- action: fill
  element: 渠道得分
  value: '20'
- action: click
  element: 保存
- action: assert_text_contains
  element: 配置表
  expect: 一级A / 二级X
- action: assert_text_contains
  element: 配置表
  expect: 一级B / 二级X
- action: assert_text_contains
  element: 配置表
  expect: '10'
- action: assert_text_contains
  element: 配置表
  expect: '20'
tags:
- compiled
meta:
  needs_review: true
  review_notes: 依赖主数据存在两个不同一级下同名二级渠道（一级A/二级X、一级B/二级X）且均符合候选过滤条件，需人工造数或 Mock 数据；选择器与配置表以「一级
    / 二级」区分同名二级的展示细节需人工核对。
  compile_backend: deepseek
  llm_profile: deepseek

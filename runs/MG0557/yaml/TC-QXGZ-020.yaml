- action: click
  element: 清洗评分规则
- action: wait_visible
  element: AI清洗评分
- action: assert_visible
  element: AI清洗评分
- action: assert_visible
  element: 已清洗次数评分
- action: assert_text_contains
  element: AI清洗评分
  expect: '0'
- action: assert_text_contains
  element: 已清洗次数评分
  expect: 未清洗
- action: assert_text_contains
  element: 已清洗次数评分
  expect: '10000'
tags:

case_id: TC-QXGZ-020
title: 从未清洗客资AI清洗评分按0分且与已清洗次数评分独立累加
requirement_id: MG0557
base_url: https://lead.z-niu.com
preconditions:
- auth: logged_in
  account_ref: default_tester
defaults:

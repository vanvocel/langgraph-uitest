case_id: TC-QXGZ-008
title: 二级渠道停用或软删除后配置行置灰且不参与新评分
requirement_id: MG0557
base_url: https://lead.z-niu.com
preconditions:
- auth: logged_in
  account_ref: default_tester
defaults:
  on_action:
    observe:
      window_ms: 8000
      toasts: []
      forbid_toast_levels:
      - error
steps:
- action: open
  url: https://lead.z-niu.com/rule/clean/
  description: 打开清洗评分规则页
- action: wait_visible
  element: 清洗评分规则
- action: click
  element: 清洗评分规则
- action: wait_visible
  element: 获客渠道评分
- action: assert_visible
  element: 获客渠道评分
  description: 确认已配置二级渠道C的配置行存在
- action: open
  url: https://lead.z-niu.com/channel/
  description: 进入获客渠道管理
- action: wait_visible
  element: 获客渠道管理
- action: click
  element: 二级渠道C
- action: click
  element: 停用
  description: 将二级渠道C停用（或软删除）
- action: open
  url: https://lead.z-niu.com/rule/clean/
  description: 返回清洗评分规则页
- action: wait_visible
  element: 清洗评分规则
- action: click
  element: 清洗评分规则
- action: wait_visible
  element: 获客渠道评分
- action: assert_visible
  element: 二级渠道C配置行
  description: 配置行保留
- action: assert_visible
  element: 二级渠道C配置行置灰标识
  description: 配置行置灰标识
- action: assert_text_contains
  element: 二级渠道C配置行
  expect: 已停用
  description: 置灰标识文案
- action: click
  element: 触发重新评分
  description: 触发命中渠道C的客资重新评分
- action: wait_visible
  element: 获客渠道评分
- action: assert_text_contains
  element: 客资获客渠道评分
  expect: '0'
  description: 该客资获客渠道评分按0分计
- action: assert_text_not_contains
  element: 客资获客渠道评分
  expect: 原配置分值
  description: 不再按原配置分值计分
- action: assert_text_contains
  element: 历史评分结果
  expect: 历史已完成评分结果不回溯
  description: 历史已完成评分结果不回溯
tags:
- compiled
- needs_fixture
meta:
  needs_review: true
  review_notes: 用例依赖造数（已配置二级渠道C并设分值、存在命中渠道C的在途/待评分客资）及跨模块操作（获客渠道管理停用/软删除、触发重新评分），自动集暂不执行；步骤仅编译到可
    UI 部分，置灰标识与重新评分结果需人工或 fixture 校验。
  compile_backend: deepseek
  llm_profile: deepseek
  needs_fixture: true

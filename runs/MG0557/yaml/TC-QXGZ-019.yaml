case_id: TC-QXGZ-019
title: 任意阶段再转AI外呼后重新命中AI清洗评分
requirement_id: MG0557
base_url: https://lead.z-niu.com
preconditions:
- auth: logged_in
  account_ref: default_tester
defaults:
  on_action:
    observe:
      window_ms: 8000
      toasts: []
      forbid_toast_levels:
      - error
steps:
- action: open
  url: https://lead.z-niu.com/rule/clean/
  description: 打开清洗评分规则页
- action: wait_visible
  element: 清洗评分规则
- action: click
  element: 清洗评分规则
- action: assert_visible
  element: AI清洗评分
  description: 确认场景启用【AI清洗评分】
- action: assert_text
  element: AI清洗评分
  expect: '0'
  description: 确认人工清洗后【AI清洗评分】为0
- action: assert_text_contains
  element: 页面
  expect: 最近一次为 AI 外呼
  description: 再次AI外呼回传后重新命中「最近一次为 AI 外呼」档并计分
- action: assert_text_contains
  element: 页面
  expect: 按最新一次清洗方式匹配
  description: 按最新一次清洗方式匹配，不保留历史阶段档位
tags:
- compiled
- manual
- ai_outbound
meta:
  needs_review: true
  review_notes: 依赖第三方 AI 外呼回传与人工造数，自动集不执行；步骤仅编译到可 UI 验证部分，回传与计分需人工核对。
  compile_backend: deepseek
  llm_profile: deepseek
  manual_only: true
